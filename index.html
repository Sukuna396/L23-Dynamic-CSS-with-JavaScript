<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Magic Aquarium</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="title"> My Magic Aquarium</h1>
    <div id="aquarium"><img id="fish" src="fish.png" width="150">
    
    <img id="octopus" src="octopus.png" width="100">
    
    <h2 id="message">Welcome to my underwater world!</h2></div>
    <div class="controls">
        <button onclick="changeWater()">Change Water</button>
        <button onclick="resizeFish()">Grow Fish</button>
        
        <button onclick="rotateFish()">Rotate Fish</button>
        
        <button onclick="showCreature()">Reveal Creature</button>
        
        <button onclick="hideCreature()">Hide Creature</button>
    </div>
    <script src="Script.Js"></script>
</body>
</html>
